[package]
name = "cosmic-web"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "EUPL-1.2"

[dependencies]
cosmic-config = { path = "../cosmic-epoch/libcosmic/cosmic-config" }
cosmic-webview = { path = "../cosmic-webview", features = ["xdg-portal"] }
libcosmic = { package = "libcosmic", path = "../cosmic-epoch/libcosmic", features = ["winit", "wgpu"] }

async-channel = "2"
dpi = "0.1"
tracing = "0.1"
url = "2.5"
# default-features disabled to avoid mimalloc conflicting with servo's global allocator
turso = { version = "0.6.1", default-features = false }
dirs = "6.0.0"
anyhow = "1.0.102"
