[package]
name = "cosmic-web"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "EUPL-1.2"

[dependencies]
cosmic-config = { git = "https://github.com/pop-os/libcosmic", rev = "1f8d8786940cc6db59d412153c5a03f69a20375c" }
cosmic-webview = { git = "https://codeberg.org/snaggen/cosmic-webview", features = ["xdg-portal"] }
libcosmic = { package = "libcosmic", git = "https://github.com/pop-os/libcosmic", rev = "1f8d8786940cc6db59d412153c5a03f69a20375c", features = ["winit", "wgpu"] }

async-channel = "2"
dpi = "0.1"
serde = { version = "1", features = ["derive"] }
tracing = "0.1"
url = "2.5"
# default-features disabled to avoid mimalloc conflicting with servo's global allocator
turso = { version = "0.6.1", default-features = false }
dirs = "6.0.0"
anyhow = "1.0.102"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots"] }
tokio = { version = "1", features = ["fs", "rt", "net", "time"] }
# MPRIS D-Bus media integration. Runs on its own current-thread Tokio runtime;
# zbus uses the Tokio backend when a runtime is present. default-features off
# keeps our request minimal — libcosmic already unifies the rest of the features.
zbus = { version = "5", default-features = false, features = ["tokio"] }
# AdBlock Plus / uBlock Origin filter list engine (Brave's Rust implementation).
# embedded-domain-resolver is required; mimalloc excluded to avoid conflicting
# with Servo's global allocator.
adblock = { version = "0.12", default-features = false, features = ["embedded-domain-resolver", "full-regex-handling"] }
serde_json = "1"
# Matches the image version cosmic-webview's screenshot() returns (RgbaImage).
image = { version = "0.25", default-features = false, features = ["png", "ico"] }
clap = { version = "4.6.6", features = ["derive"] }

[features]
# Gamepad API. Turns on the matching feature in cosmic-webview, which turns on
# Servo's; off by default because reading input devices is a fingerprinting
# surface that most browsing does not need.
gamepad = ["cosmic-webview/gamepad"]

# WebDriver automation. Starts a protocol server when --webdriver-port is given,
# for driving the browser from a test client.
webdriver = ["cosmic-webview/webdriver"]

[dev-dependencies]
pollster = "0.4"
